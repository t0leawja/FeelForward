<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/responsive.css">

</head>
<body>

<div class="chat-box">


<div class="header">

<h2>
💬 CHAT
</h2>


<button class="exit" onclick="exitChat()">
ออก
</button>


</div>



<div class="messages" id="messages">

</div>



<div class="input-area">
    <textarea id="message"
        placeholder="พิมพ์ข้อความ..."></textarea>

    <button class="send-btn"
onclick="sendMessage()">
ส่ง
</button>

</div>


</div>



<script type="module">


import { db } from "./firebase.js";


import {

collection,
addDoc,
query,
orderBy,
onSnapshot,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";



let roomID;

let messagesRef;

const role = localStorage.getItem("role") || "user";

async function init(){

roomID = new URLSearchParams(location.search).get("roomID") 
|| localStorage.getItem("roomID");

if(!roomID){

    alert("ไม่พบห้องสนทนา");

    location.href = "select.html";

    return;

}


messagesRef =
collection(
db,
"chats",
roomID,
"messages"
);



startChat();



}


init();

const textarea = document.getElementById("message");

console.log(textarea.scrollHeight);

textarea.style.height = "45px";

textarea.addEventListener("input", () => {

    textarea.style.height = "45px";

    const newHeight = Math.min(
        textarea.scrollHeight,
        120
    );

    textarea.style.height = newHeight + "px";

});

textarea.addEventListener("keydown", (event) => {

    if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
    }

})

function startChat(){


const q = query(
messagesRef,
orderBy("time")
);



onSnapshot(q,(snapshot)=>{


const box =
document.getElementById("messages");


box.innerHTML="";



snapshot.forEach((doc)=>{


const data = doc.data();



const div =
document.createElement("div");



div.className =
"message " +
(data.sender==="user"
? "send"
: "receive");



div.innerHTML = `

<div>
${data.text}
</div>

<small>
${data.createdAt || ""}
</small>

`;



box.appendChild(div);



});



box.scrollTop =
box.scrollHeight;



});


}



window.sendMessage = async function(){

    const textarea = document.getElementById("message");

    const msg = textarea.value.trim();

    if(msg === "") return;

    await addDoc(
        messagesRef,
        {
            text: msg,
            sender: "user",
            time: Date.now(),
            createdAt: new Date().toLocaleTimeString(
                "th-TH",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )
        }
    );

    // ล้างข้อความ
    textarea.value = "";

    // รีเซ็ตความสูงของกล่องข้อความ
    textarea.style.height = "auto";
    textarea.style.height = "40px";

};




window.enterSend = function(event){


if(event.key==="Enter"){


sendMessage();


}


};
window.exitChat = async function () {

    const roomRef = doc(db, "chats", roomID);

    await updateDoc(roomRef, {
        status: "closed"
    });

    localStorage.removeItem("roomID");
    localStorage.removeItem("room");

    location.href = "thanks.html";
};

window.addEventListener("focusin", () => {
    console.log(window.scrollY);
});

</script>


</body>

</html>
