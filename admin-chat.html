<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Admin Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/admin-chat.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>


<div class="chat-box">


<div class="header">

 <h6>
🛠 Admin Chat 
 </h6>   

<button class="exit" onclick="exitChat()">
ออก
</button>

</div>



<div class="messages" id="messages"></div>


<div class="input2-area">

<textarea
id="text"
placeholder="ตอบกลับ...">
</textarea>

<button class="buttonadminchat"
onclick="sendMessage()">
ส่ง
</button>

</div>



<script type="module">


import { db } from "./firebase.js";


import {

collection,
addDoc,
query,
orderBy,
onSnapshot,
doc,
updateDoc,
deleteDoc

}

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";



// รับ roomID จาก URL

const params = new URLSearchParams(location.search);
const roomID = params.get("roomID");

console.log("roomID =", roomID);

if (!roomID) {
    alert("ไม่พบ roomID");
    location.href = "admin-dashboard.html";
}

// ฟังสถานะของห้อง
const roomRef = doc(db, "chats", roomID);

let isClosing = false;
let isTyping = false;

onSnapshot(roomRef, async (snap) => {

    if (!snap.exists()) return;

    const data = snap.data();

    isTyping = (data.typing === "user");

    renderMessages();

    if (data.status === "closed" && data.closedBy === "user") {

        isClosing = true;

        alert("ผู้เข้าปรึกษาได้ออกจากห้องแชทแล้ว");

        await deleteDoc(roomRef);

        location.href = "admin-dashboard.html";

    }

});


// ห้องข้อความ

const messagesRef = collection(
db,
"chats",
roomID,
"messages"
);



// ส่งข้อความ Admin

window.sendMessage = async function(){

    const input = document.getElementById("text");

    const msg = input.value.trim();

    if(msg === "") return;

    await addDoc(messagesRef,{

        text:msg,
        sender:"admin",
        time:Date.now(),
        createdAt:new Date().toLocaleTimeString(
            "th-TH",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    });

    input.value = "";

    console.log("Admin typing...");

    await updateDoc(roomRef, {
    typing: ""
});

    // รีเซ็ตความสูงของ textarea
    input.style.height = "45px";

};


// เพิ่มโค้ดตรงนี้
const textarea = document.getElementById("text");

// กำหนดความสูงเริ่มต้น
textarea.style.height = "45px";

// ปรับความสูงอัตโนมัติ

// กำลังพิมพ์
let typingTimer;

textarea.addEventListener("input", async () => {

    textarea.style.height = "45px";

    const newHeight = Math.min(
        textarea.scrollHeight,
        120
    );

    textarea.style.height = newHeight + "px";

    await updateDoc(roomRef, {
        typing: "admin"
    });

    clearTimeout(typingTimer);

    typingTimer = setTimeout(async () => {

        await updateDoc(roomRef, {
            typing: ""
        });

    }, 1000);

});

// กด Enter เพื่อส่งข้อความ
textarea.addEventListener("keydown", (event) => {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();
        sendMessage();

    }

});





// รับข้อความ

let allMessages = [];

const q=query(

messagesRef,

orderBy("time")

);



onSnapshot(q,(snapshot)=>{


const box=document.getElementById("messages");

allMessages = [];

snapshot.forEach(doc => {

    allMessages.push(doc.data());

});

renderMessages();


box.scrollTop=box.scrollHeight;


});

function renderMessages() {

    const box = document.getElementById("messages");

    box.innerHTML = "";

    allMessages.forEach((data) => {

        const div = document.createElement("div");

        div.className = "message " + data.sender;

        div.innerHTML = `
            ${data.text}

            <div class="time">
                ${data.createdAt}
            </div>
        `;

        box.appendChild(div);

    });

    if (isTyping) {

        const typingBubble = document.createElement("div");

        typingBubble.className = "message receive typing-bubble";

        typingBubble.innerHTML = `
            <span class="typing-text">กำลังพิมพ์</span>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        box.appendChild(typingBubble);

    }

    box.scrollTop = box.scrollHeight;

}


window.exitChat = async function () {

    const ok = confirm("ต้องการออกจากห้องแชทใช่หรือไม่?");

    if (!ok) return;

    try {

        // แจ้งว่าฝั่งแอดมินออกจากห้อง
        await updateDoc(roomRef, {
            status: "closed",
            closedBy: "admin"
        });

        // กลับหน้า Dashboard
        location.href = "admin-dashboard.html";

    } catch (err) {

        console.error(err);
        alert("ออกจากห้องไม่สำเร็จ");

    }

};


</script>


</body>
</html>
